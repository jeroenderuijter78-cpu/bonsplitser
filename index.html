<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#174f43" />
  <title>Bonsplitser</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root{--bg:#f4f7f5;--card:#fff;--ink:#18312b;--muted:#6f7f7a;--line:#dbe5e1;--primary:#174f43;--accent:#f2a65a;--shadow:0 10px 28px rgba(24,49,43,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 44px}.brand{text-align:center;margin-bottom:24px}.brand img{width:min(420px,82vw);height:auto;display:block;margin:0 auto}.brand p{margin:6px auto 0;max-width:590px;color:var(--muted);font-size:15px;line-height:1.5}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.panel h1{font-size:24px;margin:0 0 6px}.panel>p{margin:0 0 20px;color:var(--muted);line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{appearance:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:20px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;transition:.15s ease;min-height:155px}.choice:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(24,49,43,.08);border-color:#b9cec6}.choice:active{transform:none}.icon{font-size:32px;display:block;margin-bottom:12px}.choice strong{font-size:18px;display:block;margin-bottom:6px}.choice span:last-child{font-size:14px;color:var(--muted);line-height:1.45;display:block}
    .status{display:none;margin-top:15px;border-radius:14px;padding:12px 14px;background:#eaf7ef;color:#287a54;font-size:14px}.status.error{background:#fff0f0;color:#b84646}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
    @media(max-width:650px){.wrap{width:min(100% - 20px,920px);padding-top:18px}.panel{padding:16px;border-radius:18px}.grid{grid-template-columns:1fr}.choice{min-height:auto;padding:17px}.brand{margin-bottom:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <img src="assets/bonsplitser-logo.png" alt="Bonsplitser">
      <p>Van één bon tot een hele dag samen op pad: kies wat je wilt verdelen.</p>
    </div>
    <section class="panel">
      <h1>Wat wil je doen?</h1>
      <p>Kies de manier die past bij dit moment. Je gegevens blijven op dit apparaat.</p>
      <div class="grid">
        <button class="choice" type="button" data-mode="live"><span class="icon">🍻</span><strong>Live bijhouden</strong><span>Registreer tijdens het eten of drinken meteen wie wat neemt.</span></button>
        <button class="choice" type="button" data-mode="scan"><span class="icon">📷</span><strong>Bon scannen</strong><span>Maak een foto van de bon, controleer de herkenning en verdeel daarna.</span></button>
        <button class="choice" type="button" data-mode="after"><span class="icon">🧾</span><strong>Bon achteraf verdelen</strong><span>Voer de bonregels handmatig in en wijs consumpties toe.</span></button>
        <button class="choice trip" type="button" id="tripBtn"><span class="icon">🚗</span><strong>Uitje verrekenen</strong><span>Meerdere voorschotten en kosten verdelen en automatisch zien wie aan wie betaalt.</span></button>
      </div>
      <div class="status" id="status">Bonsplitser wordt geladen…</div>
    </section>
    <div class="foot">Bonsplitser · bedragen worden lokaal in je browser verwerkt</div>
  </main>
  <script>
    const statusBox=document.getElementById('status');
    document.getElementById('tripBtn').addEventListener('click',()=>{ location.href='uitje.html'; });
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>launch(btn.dataset.mode)));

    async function launch(mode){
      statusBox.className='status'; statusBox.style.display='block'; statusBox.textContent='Bonsplitser wordt geladen…';
      document.querySelectorAll('button').forEach(b=>b.disabled=true);
      try{
        const res=await fetch('app.html',{cache:'no-store'});
        if(!res.ok) throw new Error('app.html kon niet worden geladen');
        let html=await res.text();
        const safeMode=JSON.stringify(mode);
        const extra=`<script>setTimeout(()=>{const b=document.querySelector('[data-start-mode='+${safeMode}+']'); if(b) b.click();},50);<\/script>`;
        html=html.replace('</body>',extra+'</body>');
        html=html.replace('<div class="top-actions"><button class="linkbtn" id="resetBtn">','<div class="top-actions"><button class="linkbtn" onclick="location.reload()">← Hoofdmenu</button><button class="linkbtn" id="resetBtn">');
        document.open(); document.write(html); document.close();
      }catch(err){
        document.querySelectorAll('button').forEach(b=>b.disabled=false);
        statusBox.className='status error'; statusBox.textContent='Laden is niet gelukt. Vernieuw de pagina en probeer het opnieuw.';
        console.error(err);
      }
    }
  </script>
</body>
</html>
